<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512"><defs>
      <!-- Base R Geometry -->
      <path id="raw-r" d="M119 74h177c75 0 126 41 126 111 0 48-24 82-67 99l80 118H304l-66-105h-44v105H119V74Zm75 65v95h94c39 0 59-17 59-48 0-31-20-47-59-47h-94Z"></path>

      <!-- Master Gradients for Chamfered v1 -->
      <linearGradient id="c1-rim-t" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#ffffff"></stop>
        <stop offset="40%" stop-color="#d8b4fe"></stop>
        <stop offset="100%" stop-color="#9333ea"></stop>
      </linearGradient>
      <linearGradient id="c1-rim-b" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#6b21a8"></stop>
        <stop offset="100%" stop-color="#19022b"></stop>
      </linearGradient>
      <linearGradient id="c1-center" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#a855f7"></stop>
        <stop offset="50%" stop-color="#7e22ce"></stop>
        <stop offset="100%" stop-color="#4c1d95"></stop>
      </linearGradient>
      <linearGradient id="c1-r-gradient" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#ffffff"></stop>
        <stop offset="60%" stop-color="#fdf4ff"></stop>
        <stop offset="100%" stop-color="#f3e8ff"></stop>
      </linearGradient>

      <!-- The Final Master Symbol (Chamfered v1) -->
      <symbol id="rhythia-final-logo" viewBox="0 0 512 512">
        <!-- Outer drop shadow -->
        <polygon points="256,40 472,256 256,472 40,256" fill="#000000" opacity="0.75" transform="translate(0, 16)"></polygon>
        <!-- Bevel Outer Base -->
        <polygon points="256,36 476,256 256,476 36,256" fill="url(#c1-rim-b)"></polygon>
        <!-- Top Light Catching Facet of Chamfer -->
        <polygon points="256,36 476,256 410,256 256,102 102,256 36,256" fill="url(#c1-rim-t)"></polygon>
        <!-- Outer Chamfer Crisp Edge Stroke -->
        <polygon points="256,36 476,256 256,476 36,256" fill="none" stroke="#e9d5ff" stroke-width="3" opacity="0.8"></polygon>
        <!-- Recessed Dark Groove -->
        <polygon points="256,96 416,256 256,416 96,256" fill="#140224"></polygon>
        <!-- Raised Center Diamond Pad -->
        <polygon points="256,102 410,256 256,410 102,256" fill="url(#c1-center)"></polygon>
        <!-- Inner Specular Glint Line -->
        <polyline points="108,256 256,108 404,256" fill="none" stroke="#ffffff" stroke-width="3.5" opacity="0.6"></polyline>
        <polygon points="256,36 272,52 256,68 240,52" fill="#ffffff"></polygon>

        <!-- Litera R: Bold Dark Keyline + Deep 3D Shadow + Crisp Face -->
        <use href="#raw-r" fill="#0b0117" transform="translate(0, 12)"></use>
        <use href="#raw-r" fill="#1e0538" transform="translate(0, 6)"></use>
        <!-- Dark Bold Outline for Maximum Pop -->
        <use href="#raw-r" fill="none" stroke="#120224" stroke-width="26" stroke-linejoin="round"></use>
        <!-- Clean White/Lav Face -->
        <use href="#raw-r" fill="url(#c1-r-gradient)"></use>
        <!-- Top Highlight Stroke on R -->
        <path d="M119 74h177c75 0 126 41 126 111 0 6 0 12-2 18-8-60-56-96-124-96H119V74Z" fill="#ffffff" opacity="0.9"></path>
      </symbol>
    </defs><use href="#rhythia-final-logo"/></svg>