<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reimagined for Rhythia</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body data-theme="reimagined" data-look="classic" data-size="default" id="popupRoot">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="rxArt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a78bfa" stop-opacity=".55"/><stop offset="1" stop-color="#fb923c" stop-opacity=".45"/></linearGradient>
      <linearGradient id="rxFade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a78bfa" stop-opacity="0"/><stop offset=".55" stop-color="#a78bfa" stop-opacity=".3"/><stop offset="1" stop-color="#fb923c" stop-opacity=".45"/></linearGradient>
    </defs>
  </svg>
  <div class="pop">
    <header class="p-head">
      <svg class="logo" viewBox="0 0 512 512" aria-hidden="true">
        <defs>
          <path id="raw-r" d="M119 74h177c75 0 126 41 126 111 0 48-24 82-67 99l80 118H304l-66-105h-44v105H119V74Zm75 65v95h94c39 0 59-17 59-48 0-31-20-47-59-47h-94Z"></path>
          <linearGradient id="c1-rim-t" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ffffff"></stop><stop offset="40%" stop-color="#d8b4fe"></stop><stop offset="100%" stop-color="#9333ea"></stop></linearGradient>
          <linearGradient id="c1-rim-b" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#6b21a8"></stop><stop offset="100%" stop-color="#19022b"></stop></linearGradient>
          <linearGradient id="c1-center" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#a855f7"></stop><stop offset="50%" stop-color="#7e22ce"></stop><stop offset="100%" stop-color="#4c1d95"></stop></linearGradient>
          <linearGradient id="c1-r-gradient" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffffff"></stop><stop offset="60%" stop-color="#fdf4ff"></stop><stop offset="100%" stop-color="#f3e8ff"></stop></linearGradient>
        </defs>
        <polygon points="256,36 476,256 256,476 36,256" fill="url(#c1-rim-b)"></polygon>
        <polygon points="256,36 476,256 410,256 256,102 102,256 36,256" fill="url(#c1-rim-t)"></polygon>
        <polygon points="256,96 416,256 256,416 96,256" fill="#140224"></polygon>
        <polygon points="256,102 410,256 256,410 102,256" fill="url(#c1-center)"></polygon>
        <use href="#raw-r" fill="none" stroke="#120224" stroke-width="24" stroke-linejoin="round"></use>
        <use href="#raw-r" fill="url(#c1-r-gradient)"></use>
      </svg>
      <div class="p-brand"><b>Reimagined for Rhythia</b><small><span id="ver"></span><span class="badge" id="lookBadge" hidden>Experimental</span></small></div>
      <div class="look" id="look" role="radiogroup" aria-label="Site look">
        <button type="button" role="radio" aria-checked="true" data-look="classic" title="Rhythia’s own pages, with extra panels">Classic</button>
        <button type="button" role="radio" aria-checked="false" data-look="exodus" title="The whole site, redesigned (experimental)">Exodus</button>
      </div>
    </header>

    <p class="alert" id="dataReadinessNotice" role="alert" hidden></p>
    <button class="alert" type="button" id="consentAlert" data-go="data" hidden><span>Choose where profile history comes from.</span><em>Choose</em></button>

    <nav class="tabs" role="tablist" id="tabs">
      <button role="tab" type="button" aria-selected="true" data-tab="features">Features</button>
      <button role="tab" type="button" aria-selected="false" data-tab="look">Appearance</button>
      <button role="tab" type="button" aria-selected="false" data-tab="data">Data</button>
      <i class="ink" id="ink" aria-hidden="true"></i>
    </nav>

    <main class="body" id="body" role="tabpanel"></main>

    <footer class="p-foot">
      <span>Made by Shuriel</span>
      <nav>
        <a href="mailto:contact@shuriel.com?subject=Reimagined%20for%20Rhythia%20bug%20report">Report a bug</a>
        <a href="https://shuriel.com/policies/reimagined/#privacy" target="_blank" rel="noreferrer">Privacy</a>
        <a href="https://shuriel.com/policies/reimagined/#terms" target="_blank" rel="noreferrer">Terms</a>
        <a href="https://github.com/Rhythia-Reimagined-Extension/Extension" target="_blank" rel="noreferrer">GitHub</a>
      </nav>
    </footer>
    <div class="toast" id="toast" role="status"></div>
  </div>

  <script src="../shared/consent.js"></script>
  <script src="../shared/settings/schema.js"></script>
  <script src="../shared/colour.js"></script>
  <script src="../shared/exodus-themes.js"></script>
  <script src="../shared/classic-themes.js"></script>
  <script src="../shared/data/data-schema.js"></script>
  <script src="popup.js"></script>
</body>
</html>
