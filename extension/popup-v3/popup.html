<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rhythia Reimagined</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main
      class="popup"
      data-theme="reimagined"
      data-size="default"
      aria-label="Rhythia Reimagined settings"
    >
      <header class="popup-header" id="popup-header">
        <button
          class="brand-button"
          id="tools-trigger"
          type="button"
          data-v3-route="about"
          aria-label="Open About"
          aria-expanded="false"
        >
          <img src="../rhythia-reimagined-icon.svg" alt="" />
        </button>
        <div class="brand-copy">
          <strong id="brand-name">Rhythia Reimagined</strong
          ><small>Slightly cleaner. Slightly more useful.</small>
        </div>
        <span class="version" id="version">v1.1.0 - UI Modernization</span>
      </header>

      <div class="popup-layout">
        <nav class="v3-nav" id="v3-nav" aria-label="Popup navigation">
          <button
            type="button"
            class="v3-nav-item is-selected"
            data-v3-route="overview"
            aria-current="page"
            title="Overview"
            aria-label="Overview"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="4" y="4" width="6" height="6" rx="1"></rect>
              <rect x="14" y="4" width="6" height="6" rx="1"></rect>
              <rect x="4" y="14" width="6" height="6" rx="1"></rect>
              <rect x="14" y="14" width="6" height="6" rx="1"></rect></svg
            ><span>Overview</span>
          </button>
          <button
            type="button"
            class="v3-nav-item"
            data-v3-route="profile"
            title="Profile"
            aria-label="Profile"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="8" r="3.3"></circle>
              <path
                d="M5.5 20c.6-3.4 2.7-5.2 6.5-5.2s5.9 1.8 6.5 5.2"
              ></path></svg
            ><span>Profile</span>
          </button>
          <button
            type="button"
            class="v3-nav-item"
            data-v3-route="scores"
            title="Scores"
            aria-label="Scores"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 5.5h14v13H5z"></path>
              <path d="M8 15.5v-3M12 15.5V9M16 15.5v-5"></path></svg
            ><span>Scores</span>
          </button>
          <button
            type="button"
            class="v3-nav-item"
            data-v3-route="history"
            title="History"
            aria-label="History"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 7.5h14M5 12h14M5 16.5h9"></path>
              <circle
                cx="4"
                cy="7.5"
                r=".7"
                fill="currentColor"
                stroke="none"
              ></circle>
              <circle
                cx="4"
                cy="12"
                r=".7"
                fill="currentColor"
                stroke="none"
              ></circle>
              <circle
                cx="4"
                cy="16.5"
                r=".7"
                fill="currentColor"
                stroke="none"
              ></circle></svg
            ><span>History</span>
          </button>
          <button
            type="button"
            class="v3-nav-item"
            data-v3-route="data"
            title="Data"
            aria-label="History and Data"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 7.5h14v11H5z"></path>
              <path d="M8 7.5V5h8v2M8.5 11h7M8.5 14.5h4"></path></svg
            ><span>Data</span>
          </button>
          <button
            type="button"
            class="v3-nav-item"
            data-v3-route="about"
            title="About"
            aria-label="About"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="8.5"></circle>
              <path d="M12 11v5M12 8.2v.2"></path></svg
            ><span>About</span>
          </button>
        </nav>
        <div class="popup-main">
          <div class="popup-content" id="popup-content">
            <div id="v3-screen" aria-live="polite"></div>
          </div>
        </div>
      </div>

      <section
        class="tools-dialog"
        id="tools-dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="tools-dialog-title"
        aria-hidden="true"
        inert
      >
        <header class="tools-dialog-header">
          <div>
            <strong id="tools-dialog-title">Diagnostics</strong
            ><small>Optional troubleshooting information</small>
          </div>
          <button class="tools-close" id="tools-close" type="button">
            Back
          </button>
        </header>
        <div class="tools-dialog-content">
          <p class="v3-helper">
            Debug logging is controlled here and does not change the public
            popup layout.
          </p>
          <label class="v3-check-row"
            ><input id="debugLogs-visible" type="checkbox" /><span
              >Debug logging</span
            ></label
          >
        </div>
      </section>
      <footer class="popup-footer">
        <a
          href="https://github.com/Rhythia-Reimagined-Extension/Extension/issues/new?template=bug_report.md"
          target="_blank"
          rel="noreferrer"
          >Report</a
        ><span>·</span
        ><a
          href="https://github.com/Rhythia-Reimagined-Extension/Extension/blob/main/PRIVACY.md"
          target="_blank"
          rel="noreferrer"
          >Privacy</a
        ><span>·</span
        ><a href="https://github.com/Rhythia-Reimagined-Extension" target="_blank" rel="noreferrer"
          >GitHub</a
        ><span>·</span
        ><button type="button" data-v3-route="about">About</button>
      </footer>
    </main>
    <script src="../core/bridges/runtime-bridge.js"></script>
    <script src="../core/bridges/storage-mutation-bridge.js"></script>
    <script src="../shared/themes/white.js"></script>
    <script src="../shared/themes/dark.js"></script>
    <script src="../shared/themes/reimagined.js"></script>
    <script src="../shared/time.js"></script>
    <script src="../shared/debounce.js"></script>
    <script src="../shared/data/data-schema.js"></script>
    <script src="../shared/data/data-migrations.js"></script>
    <script src="../shared/data/data-repository.js"></script>
    <script src="../core/bridges/data-store-bridge.js"></script>
    <script src="../shared/data/data-history.js"></script>
    <script src="../core/data/transfer/serialization.js"></script>
    <script src="../core/data/transfer/validation.js"></script>
    <script src="../core/data/transfer/conflict-policy.js"></script>
    <script src="../core/data/transfer/restoration.js"></script>
    <script src="../core/data/transfer/api.js"></script>
    <script src="../shared/data/data-transfer.js"></script>
    <script src="../core/data/backup/policy.js"></script>
    <script src="../core/data/backup/payload.js"></script>
    <script src="../core/data/backup/handle-store.js"></script>
    <script src="../core/data/backup/file-writer.js"></script>
    <script src="../core/data/backup/service.js"></script>
    <script src="../core/data/backup/api.js"></script>
    <script src="../shared/data/data-backup.js"></script>
    <script src="views/v3-state.js"></script>
    <script src="views/v3-markup-core.js"></script>
    <script src="views/v3-markup-data.js"></script>
    <script src="views/v3-data-actions.js"></script>
    <script src="views/v3-appearance.js"></script>
    <script src="views/v3-modules.js"></script>
    <script src="views/v3-diagnostics.js"></script>
    <script src="views/v3-renderer.js"></script>
    <script src="views/v3-events.js"></script>
    <script src="views/popup-application.js"></script>
    <script src="views/v3-bootstrap.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
